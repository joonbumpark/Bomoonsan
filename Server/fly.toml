# fly.io 배포 설정. 앱 이름/리전은 `fly launch` 또는 `fly apps create`로 실제 생성할 때 확정된다.
app = "bomoonsan-match3"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "match3_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
